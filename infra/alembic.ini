# Run from the repository root:
#   uv run alembic -c infra/alembic.ini upgrade heads
#
# Each module owns an independent branch, so five people can generate a
# migration on the same day without a down_revision collision.
# See docs/engineering/migrations.md.
[alembic]
script_location = infra/alembic
prepend_sys_path = .

version_locations = packages/core/migrations
                    modules/audio/migrations
                    modules/extraction/migrations
                    modules/gap/migrations
                    modules/context/migrations
                    modules/intelligence/migrations

version_path_separator = newline
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
