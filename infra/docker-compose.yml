# Local development services. See docs/engineering/environments.md.
# Two services, both needed by everyone: this file is what scripts/up.sh starts.
#
# On DEV-SERVER1 this is also the database stack, a compose project of its
# own. The application is a second project, infra/docker-compose.app.yml,
# joined to this one's network, so redeploying or stopping the application
# never restarts the database (#517).
name: autune
# Containers are named <project>-<service> (autune-postgres, autune-redis)
# rather than compose's <project>-<service>-1. The project name stays in front,
# so `-p <other>` still runs a second copy beside this one.

services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    # pgvector, not plain postgres: embeddings live here rather than in a
    # separate vector database. See docs/decisions/0004-pgvector-over-chroma.md
    image: pgvector/pgvector:pg16
    # Back after a reboot or a Docker restart, unless someone stopped it.
    restart: unless-stopped
    environment:
      # Deployed hosts pass their own credentials; local runs keep the
      # defaults that AUTUNE_DATABASE_URL in .env.example expects.
      POSTGRES_USER: ${POSTGRES_USER:-autune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autune}
      POSTGRES_DB: ${POSTGRES_DB:-autune}
    # Loopback only: on a deployed host a bare "5432:5432" listens on every
    # interface. Containers on the same host reach it over the compose network.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only, as above. Redis has no password and is the Celery broker.
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
