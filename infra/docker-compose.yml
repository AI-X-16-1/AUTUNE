# Local development services. See docs/engineering/environments.md.
# Two services, both needed by everyone.
name: autune

services:
  postgres:
    # pgvector, not plain postgres: embeddings live here rather than in a
    # separate vector database. See docs/decisions/0004-pgvector-over-chroma.md
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autune
      POSTGRES_PASSWORD: autune
      POSTGRES_DB: autune
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autune"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
