# The application on DEV-SERVER1 (#517): api, worker, web, nginx and a
# one-shot `migrate`. .github/workflows/dev.yml runs it; on a laptop
# scripts/up.sh runs the three processes outside Docker instead.
#
# A project of its own, separate from infra/docker-compose.yml (Postgres and
# Redis), so that redeploying or stopping the application never touches the
# database. The two meet on the database project's network, where `postgres`
# and `redis` resolve by service name. Start the database project first.
name: autune-app
# Containers are named <project>-<service>: autune-app-api, autune-app-web, ...

# What the api, worker and migrate containers share. `.env.example` is the base,
# so a container sees what `cp .env.example .env` gives a laptop; `environment`
# then overrides it, the way scripts/up.sh overrides a sourced `.env`.
x-python: &python
  build: {context: .., dockerfile: infra/docker/python.Dockerfile}
  image: autune-python:dev
  env_file: [../.env.example]
  environment:
    # Dummy meetings only (#517). This mounts /api/audio/dev/token, which
    # issues a token for any email; nginx puts it behind a password.
    AUTUNE_ENV: local
    # A password holding URL-reserved characters (@ : / ?) would break this URL.
    AUTUNE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autune}:${POSTGRES_PASSWORD:-autune}@postgres:5432/${POSTGRES_DB:-autune}
    AUTUNE_REDIS_URL: redis://redis:6379/0
    AUTUNE_WEB_BASE_URL: http://${DEV_PUBLIC_HOST:-localhost}
    AUTUNE_AUDIO_HF_TOKEN: ${AUTUNE_AUDIO_HF_TOKEN:-}
    AUTUNE_AGENT_LLM_API_KEY: ${AUTUNE_AGENT_LLM_API_KEY:-}
    # The implementations scripts/up.sh runs without --real-models, for the
    # same reasons it gives: B's checkpoints are unpublished (#112) and both NLI
    # checkpoints are a private repo (#172).
    AUTUNE_EXTRACTION_CLASSIFIER_IMPL: fake
    AUTUNE_EXTRACTION_NLI_IMPL: fake
    AUTUNE_CONTEXT_NLI_IMPL: fake
    AUTUNE_CONTEXT_EMBEDDER_IMPL: kure_v1_local
    AUTUNE_CONTEXT_RERANKER_IMPL: bge_reranker_v2_m3_ko_local
    AUTUNE_GAP_NER_IMPL: spacy
    AUTUNE_INTELLIGENCE_GAP_CLASSIFIER_IMPL: local

services:
  migrate:
    <<: *python
    # Run on its own before `up` (dev.yml): `up --wait` counts a container that
    # exits, even with 0, as a failure.
    profiles: ["migrate"]
    # `heads`, plural: each module owns an independent branch (invariant 7).
    command: ["alembic", "-c", "infra/alembic.ini", "upgrade", "heads"]

  api:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME}-api
    restart: unless-stopped
    command: ["uvicorn", "autune_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Published as well as behind nginx, for calling the API directly (Swagger
    # at /docs, curl). Bound to DEV_PUBLIC_HOST, a LAN address, so it is not
    # reachable through the domain. It bypasses nginx, so /api/*/dev/ has no
    # password here: anyone on the LAN can mint a token (#517's original terms).
    ports: ["${DEV_PUBLIC_HOST:-127.0.0.1}:8000:8000"]
    volumes: ["audio-tmp:/tmp/autune-audio"]
    # Starlette writes each multipart upload to the OS temp directory before
    # module A's code runs (docs/engineering/environments.md); keep that copy
    # in memory too.
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Importing every module (torch among them) takes a while on a CPU.
      start_period: 120s

  worker:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    restart: unless-stopped
    # --pool=solo: E's classifier aborts under prefork or threads (#329), as in
    # scripts/up.sh.
    command: ["celery", "-A", "autune_worker.celery_app", "worker",
              "-Q", "default,cpu_heavy,gpu", "-l", "info", "--pool=solo"]
    volumes:
      # The API writes an upload here and the worker transcribes it, so the
      # two share it. tmpfs: raw audio never lands on a disk (invariant 11).
      - audio-tmp:/tmp/autune-audio
      # Whisper, pyannote, KURE-v1 and the re-ranker download on first use
      # (several GB); a named volume keeps them across redeploys.
      - models:/models

  beat:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME}-beat
    restart: unless-stopped
    # Sends the autune.<module>.periodic.* tasks on their clocks; the worker
    # runs them. Exactly one beat per broker, or every task fires twice: the
    # fixed container name keeps a second one from starting on this host.
    # The schedule's state goes to /tmp because /app is not writable by the
    # image's user; losing it on restart only restarts the clocks, and periodic
    # tasks must be safe to run twice (docs/architecture/async-pipeline.md).
    command: ["celery", "-A", "autune_worker.celery_app", "beat", "-l", "info",
              "-s", "/tmp/celerybeat-schedule"]

  web:
    container_name: ${COMPOSE_PROJECT_NAME}-web
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Empty: the browser calls the page's own origin, which nginx splits
        # between web and api.
        NEXT_PUBLIC_API_URL: ""
        API_PROXY_TARGET: http://api:8000
    image: autune-web:dev
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    build: {context: .., dockerfile: infra/docker/nginx.Dockerfile}
    image: autune-nginx:dev
    restart: unless-stopped
    # The only published port of the app. Bound to the address teammates use,
    # loopback when unset. /api/*/dev/ takes the team's password (default.conf).
    ports: ["${DEV_PUBLIC_HOST:-127.0.0.1}:80:80"]
    environment:
      DEV_BASIC_AUTH_PASSWORD: ${DEV_BASIC_AUTH_PASSWORD:-}
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}

networks:
  # The database project's default network (infra/docker-compose.yml).
  default:
    name: ${AUTUNE_DB_NETWORK:-autune_default}
    external: true

volumes:
  models:
    # Pinned to the name it had while the app lived in the database's project,
    # so the several GB already downloaded on the server are kept.
    name: autune_models
  audio-tmp:
    # Shared between api and worker, and in memory only.
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=1000,gid=1000,mode=0700"}
