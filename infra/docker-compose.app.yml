# The application on DEV-SERVER1 (#517): api, worker, web, nginx and a
# one-shot `migrate`. .github/workflows/dev.yml runs it; on a laptop
# scripts/up.sh runs the three processes outside Docker instead.
#
# A project of its own, separate from infra/docker-compose.yml (Postgres and
# Redis), so that redeploying or stopping the application never touches the
# database. The two meet on the database project's network, where `postgres`
# and `redis` resolve by service name. Start the database project first.
name: autune-app
# Containers are named <project>-<service>: autune-app-api, autune-app-web, ...

# What the api, worker and migrate containers share. `.env.example` is the base,
# so a container sees what `cp .env.example .env` gives a laptop; `environment`
# then overrides it, the way scripts/up.sh overrides a sourced `.env`.
x-python: &python
  build: {context: .., dockerfile: infra/docker/python.Dockerfile}
  image: autune-python:dev
  env_file: [../.env.example]
  # Anchored on its own because a merge key (`<<`) is shallow: a service that
  # writes `environment:` replaces this whole map unless it merges it back in.
  environment: &python-env
    # Dummy meetings only (#517). This mounts /api/audio/dev/token, which
    # issues a token for any email; nginx puts it behind a password.
    AUTUNE_ENV: local
    # Settings refuses the shipped default key only outside env=local, so on
    # this host nothing else stops .env.example's public key from signing
    # every session. Required: compose stops before starting anything.
    AUTUNE_SECRET_KEY: ${AUTUNE_SECRET_KEY:?set the AUTUNE_SECRET_KEY secret}
    # A password holding URL-reserved characters (@ : / ?) would break this URL.
    AUTUNE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autune}:${POSTGRES_PASSWORD:-autune}@postgres:5432/${POSTGRES_DB:-autune}
    AUTUNE_REDIS_URL: redis://redis:6379/0
    # Where the api sends the browser after sign-in, and where E's report
    # links point. Must be the origin the session cookie is set on.
    AUTUNE_WEB_BASE_URL: ${DEV_SITE_URL:-http://${DEV_PUBLIC_HOST:-localhost}}
    AUTUNE_GOOGLE_CLIENT_ID: ${AUTUNE_GOOGLE_CLIENT_ID:-}
    AUTUNE_GOOGLE_CLIENT_SECRET: ${AUTUNE_GOOGLE_CLIENT_SECRET:-}
    # Registered in the Google OAuth client as an authorised redirect URI.
    AUTUNE_GOOGLE_REDIRECT_URI: ${DEV_SITE_URL:-http://localhost}/api/auth/google/callback
    # A second Google client, for what a person connects after signing in
    # (their calendar). Blank, the sign-in client above does both. It has no
    # redirect URI of its own: the callback above finishes both flows, so
    # that address is registered on this client too.
    AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID: ${AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID:-}
    AUTUNE_GOOGLE_INTEGRATION_CLIENT_SECRET: ${AUTUNE_GOOGLE_INTEGRATION_CLIENT_SECRET:-}
    # The OAuth apps behind "connect Slack / Notion / Jira". Blank, that
    # connect answers "not configured" and the rest works. Each callback is
    # built from the site's address like Google's, not read from a setting:
    # the browser has to come back to the origin its state cookie is on, so
    # on this host there is one right value. Register exactly these in the
    # Slack, Notion and Atlassian consoles.
    AUTUNE_SLACK_CLIENT_ID: ${AUTUNE_SLACK_CLIENT_ID:-}
    AUTUNE_SLACK_CLIENT_SECRET: ${AUTUNE_SLACK_CLIENT_SECRET:-}
    AUTUNE_SLACK_REDIRECT_URI: ${DEV_SITE_URL:-http://localhost}/api/auth/slack/callback
    AUTUNE_NOTION_CLIENT_ID: ${AUTUNE_NOTION_CLIENT_ID:-}
    AUTUNE_NOTION_CLIENT_SECRET: ${AUTUNE_NOTION_CLIENT_SECRET:-}
    AUTUNE_NOTION_REDIRECT_URI: ${DEV_SITE_URL:-http://localhost}/api/auth/notion/callback
    AUTUNE_JIRA_CLIENT_ID: ${AUTUNE_JIRA_CLIENT_ID:-}
    AUTUNE_JIRA_CLIENT_SECRET: ${AUTUNE_JIRA_CLIENT_SECRET:-}
    AUTUNE_JIRA_REDIRECT_URI: ${DEV_SITE_URL:-http://localhost}/api/auth/jira/callback
    # Encrypts the token every connect above returns before it is stored.
    # Settings requires it only outside env=local, so here nothing in the
    # application stops a deploy that can connect and cannot store: dev.yml
    # does, before anything starts.
    AUTUNE_ENCRYPTION_KEY: ${AUTUNE_ENCRYPTION_KEY:-}
    AUTUNE_AUDIO_HF_TOKEN: ${AUTUNE_AUDIO_HF_TOKEN:-}
    AUTUNE_AGENT_LLM_API_KEY: ${AUTUNE_AGENT_LLM_API_KEY:-}
    # The provider key under its shared name. Module B reads it when its own
    # AUTUNE_EXTRACTION_LLM_API_KEY is blank (#701); no other module reads it.
    # A key selects nothing by itself: the classifier and resolver lines below do.
    AUTUNE_LLM_API_KEY: ${AUTUNE_LLM_API_KEY:-}
    # Module B's classifier is the cloud model on this site (decided by the
    # user, 2026-10-05, for the 10-09 gate and the 10-12 demo; #392): Gemini
    # 3.5 Flash-Lite, and no fallback model -- the blank value turns the
    # fallback off. The code's defaults are unchanged; this is this deployment
    # only. With `fake` the board showed what a keyword rule made of each line.
    #
    # Module B's resolver is the cloud model too (decided by the user,
    # 2026-10-02): it rewrites a commitment or a decision that points at
    # nothing ("그럴게") into a sentence that says what, from the lines around
    # it and the lines about the same thing, and records which lines it used.
    # With `fake` the board showed the utterance as it was said. Its models are
    # the code's defaults (`resolver_model`, and `resolver_second_model`, asked
    # once when the first answer fails a check): the blank fallback above is
    # the classifier's only.
    #
    # WHAT LEAVES THIS SERVER because of the classifier: every utterance of a
    # meeting from speakers who consented, as module A masked it, with the
    # names on the team's roster replaced (#411) -- text only, no speaker, id
    # or time. Because of the resolver, some of those lines go a second time:
    # for each commitment and decision the classifier finds, that utterance and
    # its neighbours, masked and with the roster's names replaced (#530). A
    # name that is not on the roster goes as it was said. Because of step 4
    # (below), the lines the classifier called `ambiguous` go once more, alone.
    # Nothing else of B calls a provider.
    #
    # A REAL MEETING NEEDS A PAID KEY, and #392 answered. Nothing in the code
    # can tell a real meeting from a dummy one, or a paid key from a free one.
    # AUTUNE_EXTRACTION_LLM_ACKNOWLEDGED_392 is the switch #392 asks for: B
    # refuses to load an `llm` implementation without it, classifier or
    # resolver.
    #
    # TURNING IT OFF takes two places, in one change: here, put `fake` back on
    # the classifier and remove the four lines under it; and in
    # .github/workflows/dev.yml, make AUTUNE_LLM_API_KEY optional again (the
    # comment above it and its line in "Check configuration"). Left required, a
    # deploy without the key is refused although nothing needs it. Turning off
    # only the resolver is its one line: the key and the acknowledgement stay,
    # because the classifier still needs both. Step 4 is its own line too,
    # further down; while it is `llm` the key and the acknowledgement stay
    # whatever the classifier is.
    AUTUNE_EXTRACTION_CLASSIFIER_IMPL: llm
    AUTUNE_EXTRACTION_LLM_MODEL: gemini-3.5-flash-lite
    AUTUNE_EXTRACTION_LLM_FALLBACK_MODEL: ""
    AUTUNE_EXTRACTION_RESOLVER_IMPL: llm
    AUTUNE_EXTRACTION_LLM_ACKNOWLEDGED_392: "true"
    # Module B's two digests are on, on this site (decided by the user,
    # 2026-10-05): a Slack DM to each person about their own action items.
    #   - DAILY: Tuesday to Friday, 09:00-12:00 KST -- what changed on their
    #     items since the last one, and what is theirs to do today.
    #   - WEEKLY: Monday, the list of their open items. Without it a Monday
    #     sends nothing, since the morning DM leaves Monday to it.
    #
    # WHO GETS ONE: a person with an open, confirmed item assigned to them, on
    # a team that connected Slack, who linked their own Slack account. Each
    # message goes to that person alone and through the outbound check. A
    # person stops both with "마감 알림 받기" off, or for a while with their
    # own leave dates.
    #
    # WHAT ELSE THIS STARTS: with a digest on, the worker reads Google's public
    # calendar of Korea's holidays twice a day -- a GET with no credentials
    # that carries nothing -- so that no digest goes on a public holiday.
    #
    # NOT TURNED ON, and not to be without its own decision: due-date reminders
    # (AUTUNE_EXTRACTION_DUE_REMINDERS), and the read of a person's
    # out-of-office time (AUTUNE_EXTRACTION_LEAVE_FROM_CALENDAR), which waits
    # for #841 to be on this branch.
    #
    # TURNING THEM OFF is removing the two lines; nothing else depends on them.
    AUTUNE_EXTRACTION_DAILY_DIGEST: "true"
    AUTUNE_EXTRACTION_WEEKLY_DIGEST: "true"
    # Module B's step 4 is the cloud model on this site (decided by the user,
    # 2026-10-06: "nli 3.8로 변경"): Gemini 3.8 Flash, named here although it
    # is the code's default, so this file says what this site asks. No
    # fallback model: NLI_FALLBACK_MODEL is blank by default.
    #
    # Step 4 asks, of each utterance the classifier called `ambiguous`, whether
    # the speaker promised to do it. An answer can only promote: `entailment`
    # makes the line a commitment and an action-item card; anything else, an
    # unreadable answer included, leaves it for the confirmation question.
    # With `fake` the answer was a keyword rule: a line with "겠습니다" or "할게요"
    # in it was a promise.
    #
    # WHAT LEAVES THIS SERVER because of it: the masked text of those lines --
    # a handful a meeting, usually one request -- numbered, with the roster's
    # names replaced, and one fixed sentence of ours. No speaker, id, meeting
    # or surrounding line. They are lines the classifier above already sent.
    # Same key (AUTUNE_LLM_API_KEY) and same acknowledgement as the classifier;
    # the paid-key and real-meeting rule above binds this the same way.
    #
    # TURNING IT OFF is putting `fake` back and removing the model line.
    AUTUNE_EXTRACTION_NLI_IMPL: llm
    AUTUNE_EXTRACTION_NLI_MODEL: gemini-3.8-flash
    # Module D's NLI is the one scripts/up.sh runs without --real-models, for
    # the reason it gives: the checkpoint is a private repo (#172).
    AUTUNE_CONTEXT_NLI_IMPL: fake
    AUTUNE_CONTEXT_EMBEDDER_IMPL: kure_v1_local
    AUTUNE_CONTEXT_RERANKER_IMPL: bge_reranker_v2_m3_ko_local
    AUTUNE_GAP_NER_IMPL: spacy
    AUTUNE_INTELLIGENCE_GAP_CLASSIFIER_IMPL: local

services:
  migrate:
    <<: *python
    # Run on its own before `up` (dev.yml): `up --wait` counts a container that
    # exits, even with 0, as a failure.
    profiles: ["migrate"]
    # `heads`, plural: each module owns an independent branch (invariant 7).
    command: ["alembic", "-c", "infra/alembic.ini", "upgrade", "heads"]

  api:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME}-api
    restart: unless-stopped
    command: ["uvicorn", "autune_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Published as well as behind nginx, for calling the API directly (Swagger
    # at /docs, curl). Bound to DEV_PUBLIC_HOST, a LAN address. It bypasses
    # nginx, so /api/*/dev/ has no password here: anyone on the LAN can mint a
    # token (#517's original terms).
    ports: ["${DEV_PUBLIC_HOST:-127.0.0.1}:8000:8000"]
    volumes:
      - audio-tmp:/tmp/autune-audio
      # Live transcription runs in this process: its first session loads
      # Whisper large-v3-turbo and the speaker embedder. Without the volume
      # every redeploy downloaded them again inside that session's warm-up,
      # which reads no message -- no row reached the page, and the browser's
      # stop went unread until its upload was refused 409.
      - models:/models
    # Starlette writes each multipart upload to the OS temp directory before
    # module A's code runs (docs/engineering/environments.md); keep that copy
    # in memory too.
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Importing every module (torch among them) takes a while on a CPU.
      start_period: 120s

  # Two workers, so that a transcription no longer holds up everything else.
  # One worker took every queue on --pool=solo, so while it transcribed a
  # meeting (about 1.3x the recording on this CPU) every other upload, every
  # analysis of B, C, D and E, and every Slack notice waited behind it.
  #
  # --pool=solo on both: E's classifier aborts under prefork or threads
  # (#329), as in scripts/up.sh.
  worker:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    restart: unless-stopped
    command: ["celery", "-A", "autune_worker.celery_app", "worker",
              "-Q", "default,cpu_heavy", "-l", "info", "--pool=solo"]
    volumes:
      # KURE-v1, the re-ranker and E's models download on first use (several
      # GB); a named volume keeps them across redeploys. No audio-tmp: every
      # autune.audio.* task goes to the `gpu` queue (autune_core.celery_app).
      - models:/models

  # Module A's tasks only: transcription, diarization, and A's periodic sweeps.
  # Whisper runs on the RTX 3060 (12 GB): large-v3 at float16 (pipeline.py
  # picks it for cuda) and pyannote beside it. Transcriptions still run one at
  # a time, but each takes a fraction of what it took on the CPU.
  #
  # Pyannote follows AUTUNE_AUDIO_DEVICE. Left unset on purpose: torch's wheel
  # is CUDA 13, which needs an NVIDIA driver of 580 or later; with an older
  # one torch sees no GPU, pyannote takes the CPU and logs
  # diarization_device_unavailable, and transcription is not refused.
  worker-audio:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME}-worker-audio
    restart: unless-stopped
    command: ["celery", "-A", "autune_worker.celery_app", "worker",
              "-Q", "gpu", "-l", "info", "--pool=solo", "-n", "audio@%h"]
    environment:
      <<: *python-env
      AUTUNE_AUDIO_DEVICE: cuda
    # Docker Desktop hands the GPU to the container through WSL 2. Without a
    # usable GPU the container does not start, and the deploy says so.
    gpus: all
    volumes:
      # The API writes an upload here and this worker transcribes it, so the
      # two share it. tmpfs: raw audio never lands on a disk (invariant 11).
      - audio-tmp:/tmp/autune-audio
      # Whisper and pyannote download on first use; same volume as above.
      - models:/models

  beat:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME}-beat
    restart: unless-stopped
    # Sends the autune.<module>.periodic.* tasks on their clocks; the worker
    # runs them. Exactly one beat per broker, or every task fires twice: the
    # fixed container name keeps a second one from starting on this host.
    # The schedule's state goes to /tmp because /app is not writable by the
    # image's user; losing it on restart only restarts the clocks, and periodic
    # tasks must be safe to run twice (docs/architecture/async-pipeline.md).
    command: ["celery", "-A", "autune_worker.celery_app", "beat", "-l", "info",
              "-s", "/tmp/celerybeat-schedule"]

  web:
    container_name: ${COMPOSE_PROJECT_NAME}-web
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Empty: the browser calls the page's own origin, which nginx splits
        # between web and api.
        NEXT_PUBLIC_API_URL: ""
        # The live socket goes to the API's own address instead (dev.yml):
        # through the site's address the WebSocket handshake loses its
        # Upgrade header. Empty keeps it on the page's origin.
        NEXT_PUBLIC_LIVE_URL: ${DEV_LIVE_URL:-}
        API_PROXY_TARGET: http://api:8000
    image: autune-web:dev
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    build: {context: .., dockerfile: infra/docker/nginx.Dockerfile}
    image: autune-nginx:dev
    restart: unless-stopped
    # The only published port of the app. Bound to the address teammates use,
    # loopback when unset. /api/*/dev/ takes the team's password (default.conf).
    ports: ["${DEV_PUBLIC_HOST:-127.0.0.1}:80:80"]
    environment:
      DEV_BASIC_AUTH_PASSWORD: ${DEV_BASIC_AUTH_PASSWORD:-}
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}

networks:
  # The database project's default network (infra/docker-compose.yml).
  default:
    name: ${AUTUNE_DB_NETWORK:-autune_default}
    external: true

volumes:
  models:
    # Pinned to the name it had while the app lived in the database's project,
    # so the several GB already downloaded on the server are kept.
    name: autune_models
  audio-tmp:
    # Shared between api and worker-audio, and in memory only.
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=1000,gid=1000,mode=0700"}
