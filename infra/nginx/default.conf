# One origin for the dev server (#517): the browser reaches web and api through
# port 80 here, so neither publishes a port of its own.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # autune_audio.config.MAX_UPLOAD_BYTES is 500 MB; the api enforces it and
    # answers with its own error, so let the body through to it.
    client_max_body_size 510m;

    # Resolve api and web per request through Docker's DNS, not once at
    # startup. A deploy recreates api with a new address while nginx, whose
    # image and config did not change, keeps running; with the name resolved
    # at startup every /api request then went to the old address and answered
    # 502 until nginx was restarted (2026-10-02). A variable in proxy_pass is
    # what makes nginx look the name up again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Every /dev router mounts only under AUTUNE_ENV=local, and
    # /api/audio/dev/token issues a token for any email, so these take the
    # team's password. Port 80 is plain HTTP; the domain reaches it through
    # Cloudflare (docs/engineering/environments.md, "Two ways in").
    # Case-insensitive: web's /api/:path* rewrite ignores case, so /API/.../dev
    # would otherwise fall through to `location /` and reach the api through
    # web without the password.
    location ~* ^/api/[a-z_]+/dev(/|$) {
        auth_basic "Autune dev";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass $api_upstream;
    }

    # Google sign-in takes no password here (#890): /api/auth/google/start
    # falls to the block below like any other route. Sign-in creates a user
    # for any verified Google account and the domain is public, so what keeps
    # an account outside the team out is Google's own: the OAuth consent
    # screen in Testing with only the team as test users (#602). Nothing in
    # this repository checks that status: before publishing the app or
    # changing that list, reopen #890. The /dev block above keeps its password.
    location /api/ {
        proxy_pass $api_upstream;
        # The live transcript is a WebSocket under /api/audio/live/.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        # Stream uploads to the api instead of spooling them to nginx's disk:
        # raw audio lands only in the api's tmpfs (invariant 11).
        proxy_request_buffering off;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
