[project]
name = "autune-agent"
version = "0.1.0"
description = "The agent layer: a main agent and five feature subagents over modules A-E (ADR 0010)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "autune-integrations",
    # The layer's whole job is to know every module (ADR 0010). It imports each
    # module's tools.py and nothing else of theirs.
    "autune-audio",
    "autune-extraction",
    "autune-gap",
    "autune-context",
    "autune-intelligence",
    # The supervisor graph and each subagent's subgraph. No checkpointer
    # package: agent-layer.md section 3.3 keeps run state in agent_runs.
    "langgraph>=0.6",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    # The two event subscriptions in tasks.py (agent-layer.md section 6).
    "celery>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_agent"]
