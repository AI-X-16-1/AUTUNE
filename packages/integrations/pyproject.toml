[project]
name = "autune-integrations"
version = "0.1.0"
description = "Slack / Notion / Jira / Google Calendar wrappers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_integrations"]
