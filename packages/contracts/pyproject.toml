[project]
name = "autune-contracts"
version = "0.1.0"
description = "Data contracts crossing module boundaries"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_contracts"]
