[project]
name = "autune-core"
version = "0.1.0"
description = "DB session, settings, auth, logging, shared entities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
    "pyjwt>=2.10",
    "cryptography>=44",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_core"]
