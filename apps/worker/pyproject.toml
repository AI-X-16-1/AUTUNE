[project]
name = "autune-worker"
version = "0.1.0"
description = "Celery app — task auto-registration only, no business logic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-core",
    "autune-audio", "autune-extraction", "autune-gap",
    "autune-context", "autune-intelligence",
    "celery[redis]>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_worker"]
