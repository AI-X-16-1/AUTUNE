[project]
name = "autune-bot"
version = "0.1.0"
description = "Slack Bolt app - handler auto-registration only, no business logic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-core",
    "autune-contracts",
    "autune-integrations",
    "autune-audio", "autune-extraction", "autune-gap",
    "autune-context", "autune-intelligence",
    "slack-bolt>=1.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_bot"]
