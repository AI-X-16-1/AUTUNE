[project]
name = "autune-intelligence"
version = "0.1.0"
description = "Meeting intelligence — scoring, prediction, reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "autune-integrations",
    "fastapi>=0.115",
    "celery>=5.4",
    # explain_metric's BM25 over Korean morphemes, as module D does (spec section 5).
    "rank-bm25>=0.2",
    "kiwipiepy>=0.18",
]

[project.optional-dependencies]
# SetFit gap-pattern classification (AUTUNE_INTELLIGENCE_GAP_CLASSIFIER_IMPL=local).
# Mirrors modules/gap's local-models extra: heavy ML deps stay opt-in so
# apps/api doesn't need torch to serve a health check.
local-models = [
    "setfit>=1.1",
    "sentence-transformers>=3.0",
    # Imported directly in pipeline.classifier to build the seed Dataset;
    # setfit currently pulls it in transitively but that isn't a declared
    # guarantee, so it is pinned here too.
    "datasets>=2.14",
    # Misalignment prediction (AUTUNE_INTELLIGENCE_MISALIGNMENT_PREDICTOR_IMPL=local).
    # xgboost-cpu, not xgboost: same `import xgboost`, without the ~200 MB
    # nvidia-nccl wheel the full package pulls on Linux for multi-GPU training.
    # Except on macOS, where xgboost-cpu publishes no wheel at all and installing
    # it would build from sdist (CMake plus an OpenMP that Apple clang does not
    # ship). The full package's macOS wheels carry no nccl, so there is nothing
    # to avoid there. This extra is not XGBoost-only -- gap_classifier_impl=local
    # (E's default) needs it too, so a missing wheel blocks a Mac worker that
    # never enables the predictor.
    "xgboost-cpu>=2.1; sys_platform != 'darwin'",
    "xgboost>=2.1; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_intelligence"]
