# Domain template: any cross-functional decision meeting.
#
# Reference data, versioned by git rather than by a table (#22). A template is
# not derived from a meeting, so it is the one thing module C holds that cannot
# hang off `meetings.id` — and as a file it needs no anchor at all.
#
# `item` and `question` are product copy a reader sees on S20, so they are
# Korean. Every field name and every comment is English (/CLAUDE.md section 0).
#
# **Bump `version` whenever an item changes.** It is recorded on every gap this
# template raises, so precision measured before an edit and after one can be
# read apart instead of averaged together — the same reason `gap_topics` carries
# `extractor_version`.
#
# `weight` is how much the item's absence matters, in 0..1. It is one of three
# inputs to the risk score and the only one an author controls; see
# `autune_gap.detect`.
#
# `question` is asked when nothing in the meeting matched the item, and
# `question_about` when something did — it names the topic with `{topic}`.
#
# **Follow `{topic}` with an invariant particle** — 의, 에, 에서, 에 대해. 은/는,
# 이/가, 을/를 change form with the last syllable of the noun before them, and a
# topic label is a noun read out of a meeting, so the right form is not knowable
# here. The loader refuses the variable ones; the failure it prevents is a screen
# showing "캐시은".
#
# `keywords` decide whether the meeting touched the item at all. Keep them to
# words a meeting would actually say — a keyword that matches everything raises
# no gap, and one that matches nothing raises a gap in every meeting. Two
# characters is the minimum; shorter than that matches by accident.
#
# `relations` name step-2 relations whose edge is the meeting having raised the
# item: a topic at either end of one matches it like a keyword hit. For an item
# that is about how two things stand to each other, which no topic label says
# — "검증 스크립트가 먼저 있어야 롤백 절차가 의미가 있습니다" states a
# dependency without the word 의존. Never `co_occurs`; the loader refuses it.
#
# `examples` are sentences a meeting says when it settles the item, read by a
# sentence embedder when AUTUNE_GAP_EMBEDDER_IMPL is on (`autune_gap.semantic`).
# They are what catches an item settled with a verb and a date and no noun --
# "제가 금요일까지 맡겠습니다" -- which no keyword can. Write them as a person
# would say them in a meeting, varied in subject and phrasing, and **never copy
# a line from the eval set**: the harness would then be grading its own answer
# key. Version 4 added them.

key: general
name: "기본"
version: 4

items:
  - key: success_criteria
    category: measurement
    item: "성공 기준·측정 지표"
    weight: 0.9
    keywords: ["성공", "기준", "지표", "목표", "측정", "정확도", "정밀도", "kpi"]
    question: "이 일이 성공했다고 판단할 기준은 무엇이고, 무엇으로 측정합니까?"
    question_about: "{topic}의 성공 기준은 무엇이고, 무엇으로 측정합니까?"
    examples:
      - "이 기능이 잘 됐는지는 전환율로 판단하겠습니다"
      - "목표 수치는 작업 완료율 20% 향상입니다"
      - "성공했다고 보는 기준을 정해 둡시다"

  - key: ownership
    category: ownership
    item: "담당자와 기한"
    weight: 0.9
    keywords: ["담당", "책임", "기한", "마감", "일정", "언제까지", "데드라인"]
    question: "이 일은 누가 맡고, 언제까지 끝내기로 합니까?"
    question_about: "{topic}의 담당자와 기한은 어떻게 정합니까?"
    examples:
      - "그 작업은 제가 맡겠습니다"
      - "민수님이 담당해서 수요일까지 마무리해 주세요"
      - "설계 문서는 다음 주 화요일까지 제가 올리겠습니다"

  - key: risk
    category: risk
    item: "리스크·예외 처리"
    weight: 0.8
    keywords: ["리스크", "위험", "예외", "실패", "장애", "롤백", "대비"]
    question: "이 방향이 실패하거나 예외 상황이 생기면 무엇을 합니까?"
    question_about: "{topic}에서 문제가 생기거나 예외 상황이 오면 무엇을 합니까?"
    examples:
      - "이게 잘못되면 되돌릴 방법을 준비해 둬야 합니다"
      - "장애가 나면 이전 버전으로 되돌리겠습니다"
      - "최악의 경우를 대비한 계획이 있어야 합니다"

  - key: dependency
    category: dependency
    item: "의존성·선행 조건"
    weight: 0.7
    keywords: ["의존", "선행", "전제", "필요", "블로커", "대기", "연동"]
    # `blocked_by` as well as `depends_on`: something in the way is something
    # that has to be cleared first, which is what this item asks. Version 3.
    relations: [depends_on, blocked_by]
    question: "이 일을 시작하기 전에 먼저 끝나 있어야 하는 것은 무엇입니까?"
    question_about: "{topic}에 앞서 먼저 끝나 있어야 하는 것은 무엇입니까?"
    examples:
      - "결제 모듈 작업이 끝나야 이걸 시작할 수 있습니다"
      - "디자인이 나오기 전까지는 개발을 못 합니다"
      - "다른 팀 API가 준비돼야 연동할 수 있습니다"

  - key: next_step
    category: next_step
    item: "다음 단계"
    # 0.7, the high threshold, so a meeting that never says what happens next
    # raises a gap a reader sees by default. At 0.6 a missing next step scored
    # 0.6 (a missing item scores its weight) and stayed in `medium`, which the
    # screen hides: gap_detection_v1 missed it in both cases where it was a
    # real gap. Version 2.
    weight: 0.7
    keywords: ["다음", "후속", "이후", "계획", "단계", "진행"]
    question: "이 회의 다음에 실제로 일어나는 일은 무엇입니까?"
    question_about: "{topic}에 대해 이 회의 다음에 실제로 일어나는 일은 무엇입니까?"
    examples:
      - "다음 회의에서 결과를 공유하겠습니다"
      - "우선 시안을 만들어 보고 다시 모이죠"
      - "이후에는 사용자 테스트를 진행합니다"
