[project]
name = "autune-extraction"
version = "0.1.0"
description = "Structured extraction — classification, action items"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    # service.py sends the confirmation DM through SlackApi. It resolved anyway
    # because the workspace has it, which is what made the omission invisible.
    "autune-integrations",
    "fastapi>=0.115",
    "celery>=5.4",
]

[project.optional-dependencies]
training = [
    # Fine-tuning only. Not a runtime dependency: the API and the worker never
    # train, and pulling torch into their image for code that runs on a
    # workstation would add gigabytes to every deploy.
    "torch>=2.4",
    "transformers>=4.44",
    # Trainer refuses to construct its arguments without it, and transformers
    # does not pull it in: it lives behind transformers' own `torch` extra.
    "accelerate>=1.1",
    "numpy>=1.26",
]
# The five-way classifier's in-process implementation. An extra rather than a
# dependency: apps/api serves a health check and must not load a deep-learning
# stack to do it, and a worker on the `hosted` implementation never touches
# these. See docs/engineering/dependencies.md.
#
#     uv sync --package autune-extraction --extra local-models
local-models = [
    "transformers>=4.46",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_extraction"]
