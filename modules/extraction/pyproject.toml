[project]
name = "autune-extraction"
version = "0.1.0"
description = "Structured extraction — classification, action items"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "fastapi>=0.115",
    "celery>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_extraction"]
