[project]
name = "autune-context"
version = "0.1.0"
description = "Meeting context engine — topic linking, decision lineage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "fastapi>=0.115",
    "celery>=5.4",
    "pgvector>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_context"]
