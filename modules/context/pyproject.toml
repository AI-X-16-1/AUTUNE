[project]
name = "autune-context"
version = "0.1.0"
description = "Meeting context engine — topic linking, decision lineage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "fastapi>=0.115",
    "celery>=5.4",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "httpx>=0.27",
    "rank-bm25>=0.2",
    "kiwipiepy>=0.18",
    "numpy>=1.26",
]

[project.optional-dependencies]
# In-process model implementations (``*_local``), for local development,
# CI-free runs, and evaluation. The worker image runs the ``*_http`` clients
# and does not install these. See docs/modules/context.md.
local-models = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.44",
]
# The KorNLI fine-tuning job (autune_context.training). Not installed by the
# worker image or local-models — training needs a GPU and is run on demand by
# the module owner, never in CI. See docs/modules/context.md, "Phased
# delivery" (Phase 3).
training = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_context"]
