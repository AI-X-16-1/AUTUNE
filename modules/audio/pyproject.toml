[project]
name = "autune-audio"
version = "0.1.0"
description = "Audio pipeline — STT, diarization, PII masking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "fastapi>=0.115",
    "celery>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_audio"]
