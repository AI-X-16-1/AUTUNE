[project]
name = "autune-audio"
version = "0.1.0"
description = "Audio pipeline — STT, diarization, PII masking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autune-contracts",
    "autune-core",
    "fastapi>=0.115",
    "celery>=5.4",
    # Speaker diarization. Three pyannote repos are gated and the licence has to
    # be accepted on all of them: speaker-diarization-3.1, segmentation-3.0, and
    # speaker-diarization-community-1. The pipeline loads the last two itself, so
    # missing either fails partway through loading with an error naming a model
    # you never asked for. See docs/engineering/environments.md.
    "pyannote-audio>=3.3",
    "torch>=2.5",
    "torchaudio>=2.5",
    "soundfile>=0.12",
    # CTranslate2 inference. The metric is 1.5x realtime and openai-whisper does
    # not reach it on CPU; word timestamps matter because speaker alignment (#6)
    # splits segments where two people overlap.
    "faster-whisper>=1.1",
    "python-multipart>=0.0.20",  # file uploads on the dev endpoint
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autune_audio"]
