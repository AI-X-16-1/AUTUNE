name: Windows PC Job

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    # The runner's default shell is Windows PowerShell, and the host's
    # execution policy refuses the .ps1 file the runner writes for each step.
    # cmd has no execution policy.
    defaults:
      run:
        shell: cmd
    # Every step talks to the same compose project, and each of them
    # interpolates the database URL, so all of them need these.
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      # The address teammates type into a browser. Next inlines it into the
      # web build (#517), so it is a variable, not a secret.
      DEV_PUBLIC_HOST: ${{ vars.DEV_PUBLIC_HOST }}
      # Pyannote is gated: without this every upload fails after Whisper.
      AUTUNE_AUDIO_HF_TOKEN: ${{ secrets.AUTUNE_AUDIO_HF_TOKEN }}
      # Signs every session. .env.example's key is public, and env=local
      # turns off the check that refuses it, so the deploy refuses instead.
      AUTUNE_SECRET_KEY: ${{ secrets.AUTUNE_SECRET_KEY }}
      # The team's password for /api/*/dev/ behind nginx (user `autune`).
      DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
      # Optional: without it /api/agent/chat refuses and the rest works.
      AUTUNE_AGENT_LLM_API_KEY: ${{ secrets.AUTUNE_AGENT_LLM_API_KEY }}
      # Required: the provider key under its shared name, which module B
      # reads when its own is blank (#701). The compose file sets B's
      # classifier, its resolver and its NLI (step 4, #934) to `llm`, and
      # without a key B builds none of them -- on the first meeting, after
      # the deploy looked fine. "Check configuration" refuses before that.
      AUTUNE_LLM_API_KEY: ${{ secrets.AUTUNE_LLM_API_KEY }}
      # The address the domain serves. Google sends sign-in back here, and
      # the api sends the browser here afterwards, so it must be the origin
      # the session cookie belongs to.
      DEV_SITE_URL: https://autune.shelldocs.cloud
      # Where the browser opens the live transcript socket: the API's own
      # address. On DEV_SITE_URL the handshake reaches the API without its
      # Upgrade header and is answered 404; here it is answered 101.
      DEV_LIVE_URL: wss://autune-back.shelldocs.cloud
      # Optional: without them /api/auth/google/start answers "not
      # configured" and the dev token still works.
      AUTUNE_GOOGLE_CLIENT_ID: ${{ secrets.AUTUNE_GOOGLE_CLIENT_ID }}
      AUTUNE_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTUNE_GOOGLE_CLIENT_SECRET }}
      # Optional: a second Google client for what a person connects (their
      # calendar), apart from sign-in. Without it the client above does
      # both. Both or neither.
      AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID: ${{ secrets.AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID }}
      AUTUNE_GOOGLE_INTEGRATION_CLIENT_SECRET: ${{ secrets.AUTUNE_GOOGLE_INTEGRATION_CLIENT_SECRET }}
      # Optional: the OAuth apps behind "connect Slack / Notion / Jira".
      # Without a pair, that connect answers "not configured". The redirect
      # URIs are not read from secrets: compose builds them from
      # DEV_SITE_URL, the one origin the callback can land on.
      AUTUNE_SLACK_CLIENT_ID: ${{ secrets.AUTUNE_SLACK_CLIENT_ID }}
      AUTUNE_SLACK_CLIENT_SECRET: ${{ secrets.AUTUNE_SLACK_CLIENT_SECRET }}
      AUTUNE_NOTION_CLIENT_ID: ${{ secrets.AUTUNE_NOTION_CLIENT_ID }}
      AUTUNE_NOTION_CLIENT_SECRET: ${{ secrets.AUTUNE_NOTION_CLIENT_SECRET }}
      AUTUNE_JIRA_CLIENT_ID: ${{ secrets.AUTUNE_JIRA_CLIENT_ID }}
      AUTUNE_JIRA_CLIENT_SECRET: ${{ secrets.AUTUNE_JIRA_CLIENT_SECRET }}
      # Encrypts the token each of those connects returns. Required as soon
      # as one of them is set: env=local turns off the application's own
      # check, so "Check configuration" refuses instead.
      AUTUNE_ENCRYPTION_KEY: ${{ secrets.AUTUNE_ENCRYPTION_KEY }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .

      # An unset secret reaches compose as an empty string, which the
      # compose defaults would turn into autune/autune. Refuse instead.
      # "not defined" also avoids quoting a password that holds " or &.
      # The last lines print a secret's name, never its value: NEEDS_KEY
      # holds the name of a connect client that is set.
      - name: Check configuration
        run: |
          if not defined POSTGRES_USER (echo POSTGRES_USER secret is not set & exit /b 1)
          if not defined POSTGRES_PASSWORD (echo POSTGRES_PASSWORD secret is not set & exit /b 1)
          if not defined POSTGRES_DB (echo POSTGRES_DB secret is not set & exit /b 1)
          if not defined AUTUNE_AUDIO_HF_TOKEN (echo AUTUNE_AUDIO_HF_TOKEN secret is not set & exit /b 1)
          if not defined AUTUNE_SECRET_KEY (echo AUTUNE_SECRET_KEY secret is not set & exit /b 1)
          if not defined DEV_BASIC_AUTH_PASSWORD (echo DEV_BASIC_AUTH_PASSWORD secret is not set & exit /b 1)
          if not defined DEV_PUBLIC_HOST (echo DEV_PUBLIC_HOST repository variable is not set & exit /b 1)
          if not defined AUTUNE_LLM_API_KEY (echo AUTUNE_LLM_API_KEY secret is not set and the compose file sets module B's classifier, resolver and NLI to llm & exit /b 1)
          if defined AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID if not defined AUTUNE_GOOGLE_INTEGRATION_CLIENT_SECRET (echo AUTUNE_GOOGLE_INTEGRATION_CLIENT_SECRET secret is not set and its CLIENT_ID is & exit /b 1)
          if defined AUTUNE_GOOGLE_INTEGRATION_CLIENT_SECRET if not defined AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID (echo AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID secret is not set and its CLIENT_SECRET is & exit /b 1)
          set NEEDS_KEY=
          if defined AUTUNE_SLACK_CLIENT_ID set NEEDS_KEY=AUTUNE_SLACK_CLIENT_ID
          if defined AUTUNE_SLACK_CLIENT_SECRET set NEEDS_KEY=AUTUNE_SLACK_CLIENT_SECRET
          if defined AUTUNE_NOTION_CLIENT_ID set NEEDS_KEY=AUTUNE_NOTION_CLIENT_ID
          if defined AUTUNE_NOTION_CLIENT_SECRET set NEEDS_KEY=AUTUNE_NOTION_CLIENT_SECRET
          if defined AUTUNE_JIRA_CLIENT_ID set NEEDS_KEY=AUTUNE_JIRA_CLIENT_ID
          if defined AUTUNE_JIRA_CLIENT_SECRET set NEEDS_KEY=AUTUNE_JIRA_CLIENT_SECRET
          if defined AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID set NEEDS_KEY=AUTUNE_GOOGLE_INTEGRATION_CLIENT_ID
          if defined NEEDS_KEY if not defined AUTUNE_ENCRYPTION_KEY (echo AUTUNE_ENCRYPTION_KEY secret is not set and %NEEDS_KEY% is, so a connection could not be stored & exit /b 1)
          docker version || exit /b 1

      # The database is its own compose project, so the steps below never
      # restart it. --remove-orphans clears containers of this project that
      # the file no longer defines: the application ran here before it moved
      # to infra/docker-compose.app.yml.
      - name: Start database and broker
        run: docker compose -f infra/docker-compose.yml up -d --wait --remove-orphans

      # Every image is built here, once, and the steps below use what this
      # built. Migrate and Start application each built it before: the second
      # build ran the dependency layer's `uv sync` again two minutes after the
      # first had made it (773 s and 671 s in one deploy), because the builder
      # had already dropped that several-GB layer from its cache. `migrate`
      # shares the python image, so its profile adds nothing to build.
      - name: Build images
        run: docker compose -f infra/docker-compose.app.yml build

      - name: Migrate
        run: docker compose -f infra/docker-compose.app.yml run --rm migrate

      # A key that is set and is not a Fernet key would otherwise be found by
      # the first person who connects something. The error names the
      # variable and never prints it.
      - name: Check the encryption key
        run: |
          if defined AUTUNE_ENCRYPTION_KEY docker compose -f infra/docker-compose.app.yml run --rm migrate python -c "from autune_core.crypto import ensure_configured; ensure_configured()"

      - name: Start application
        run: docker compose -f infra/docker-compose.app.yml up -d --wait --wait-timeout 600

      # Every deploy rebuilds the images, and the python one is over 10 GB;
      # the one it replaced is left untagged. Only untagged images go: the
      # build cache (uv and pnpm downloads) stays, so the next build is fast.
      - name: Remove replaced images
        run: docker image prune -f

      - name: Show services
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml ps -a
          docker compose -f infra/docker-compose.app.yml ps -a

      - name: Show application logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.app.yml logs --tail 100 api worker worker-audio web nginx
