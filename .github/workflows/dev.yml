name: Windows PC Job

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    # The runner's default shell is Windows PowerShell, and the host's
    # execution policy refuses the .ps1 file the runner writes for each step.
    # cmd has no execution policy.
    defaults:
      run:
        shell: cmd
    # Every step talks to the same compose project, and each of them
    # interpolates the database URL, so all of them need these.
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      # The address teammates type into a browser. Next inlines it into the
      # web build (#517), so it is a variable, not a secret.
      DEV_PUBLIC_HOST: ${{ vars.DEV_PUBLIC_HOST }}
      # Pyannote is gated: without this every upload fails after Whisper.
      AUTUNE_AUDIO_HF_TOKEN: ${{ secrets.AUTUNE_AUDIO_HF_TOKEN }}
      # Signs every session. .env.example's key is public, and env=local
      # turns off the check that refuses it, so the deploy refuses instead.
      AUTUNE_SECRET_KEY: ${{ secrets.AUTUNE_SECRET_KEY }}
      # The team's password for /api/*/dev/ behind nginx (user `autune`).
      DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
      # Optional: without it /api/agent/chat refuses and the rest works.
      AUTUNE_AGENT_LLM_API_KEY: ${{ secrets.AUTUNE_AGENT_LLM_API_KEY }}
      # The address the domain serves. Google sends sign-in back here, and
      # the api sends the browser here afterwards, so it must be the origin
      # the session cookie belongs to.
      DEV_SITE_URL: https://autune.shelldocs.cloud
      # Optional: without them /api/auth/google/start answers "not
      # configured" and the dev token still works.
      AUTUNE_GOOGLE_CLIENT_ID: ${{ secrets.AUTUNE_GOOGLE_CLIENT_ID }}
      AUTUNE_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTUNE_GOOGLE_CLIENT_SECRET }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .

      # An unset secret reaches compose as an empty string, which the
      # compose defaults would turn into autune/autune. Refuse instead.
      # "not defined" also avoids quoting a password that holds " or &.
      - name: Check configuration
        run: |
          if not defined POSTGRES_USER (echo POSTGRES_USER secret is not set & exit /b 1)
          if not defined POSTGRES_PASSWORD (echo POSTGRES_PASSWORD secret is not set & exit /b 1)
          if not defined POSTGRES_DB (echo POSTGRES_DB secret is not set & exit /b 1)
          if not defined AUTUNE_AUDIO_HF_TOKEN (echo AUTUNE_AUDIO_HF_TOKEN secret is not set & exit /b 1)
          if not defined AUTUNE_SECRET_KEY (echo AUTUNE_SECRET_KEY secret is not set & exit /b 1)
          if not defined DEV_BASIC_AUTH_PASSWORD (echo DEV_BASIC_AUTH_PASSWORD secret is not set & exit /b 1)
          if not defined DEV_PUBLIC_HOST (echo DEV_PUBLIC_HOST repository variable is not set & exit /b 1)
          docker version || exit /b 1

      # The database is its own compose project, so the steps below never
      # restart it. --remove-orphans clears containers of this project that
      # the file no longer defines: the application ran here before it moved
      # to infra/docker-compose.app.yml.
      - name: Start database and broker
        run: docker compose -f infra/docker-compose.yml up -d --wait --remove-orphans

      - name: Migrate
        run: docker compose -f infra/docker-compose.app.yml run --rm --build migrate

      - name: Start application
        run: docker compose -f infra/docker-compose.app.yml up -d --build --wait --wait-timeout 600

      # Every deploy rebuilds the images, and the python one is over 10 GB;
      # the one it replaced is left untagged. Only untagged images go: the
      # build cache (uv and pnpm downloads) stays, so the next build is fast.
      - name: Remove replaced images
        run: docker image prune -f

      - name: Show services
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml ps -a
          docker compose -f infra/docker-compose.app.yml ps -a

      - name: Show application logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.app.yml logs --tail 100 api worker web nginx
