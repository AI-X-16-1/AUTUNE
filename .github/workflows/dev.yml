name: Windows PC Job

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .

      # Checkout alone starts nothing: the services only run once compose
      # brings them up on the runner. --wait fails the job when a container
      # does not reach healthy, so a green run means the services are up.
      - name: Start services
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          docker version
          docker compose -f infra/docker-compose.yml up -d --wait

      - name: Show services
        if: always()
        run: docker compose -f infra/docker-compose.yml ps -a
