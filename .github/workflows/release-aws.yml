# Deploys the release branch to the AWS host (docs/engineering/environments.md,
# "The release host"). dev.yml is the dev server's, on a Windows runner; this
# one runs on a GitHub-hosted runner and reaches the host through SSM Run
# Command, so nothing listens for it: no SSH, no deploy key, no long-lived AWS
# key.
#
# The runner assumes an AWS role through OIDC. The role's trust policy accepts
# only this repository's `infra/release-1014` branch, so the same file on any
# other branch cannot deploy.
name: Release (AWS)

on:
  push:
    branches: [infra/release-1014]
  workflow_dispatch:

# A second deploy waits for the first; one is never cancelled halfway through
# a migration.
concurrency:
  group: release-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
    steps:
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The job's token reads this repository for the length of the job and
      # is passed once, as a request header: it is not put in the URL or in
      # .git/config on the host. It is in the SSM command (CloudTrail), where
      # it is already useless after the job ends.
      - name: Send the deploy command
        id: send
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          script=$(cat <<'EOS'
          set -euo pipefail
          export HOME=/root
          install -d /opt/autune/repo
          cd /opt/autune/repo
          [ -d .git ] || git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch -q --depth 1 "https://github.com/$REPO" "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -fdq
          bash infra/aws/deploy.sh
          EOS
          )
          # The values are exported on the host's side by prefixing the
          # script, so the script text itself stays constant.
          # Run Command starts the script with sh, which is dash on Ubuntu;
          # the first line hands over to bash.
          cmd=$(printf '[ -n "${BASH_VERSION:-}" ] || exec bash "$0"\nTOKEN=%q REPO=%q SHA=%q\nexport TOKEN REPO SHA\n%s\n' \
            "$GITHUB_TOKEN_VALUE" "$REPO" "$SHA" "$script")
          jq -n --arg c "$cmd" \
            '{commands: [$c], executionTimeout: ["3600"]}' > params.json
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "release ${SHA::8}" \
            --timeout-seconds 120 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          rm -f params.json
          echo "command_id=$id" >> "$GITHUB_OUTPUT"

      # `aws ssm wait` gives up after about 100 seconds and a first build takes
      # many minutes, so poll.
      - name: Wait for the command
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          while :; do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 20 ;;
              *) echo "command ended: $status"; break ;;
            esac
          done
          # The last 24,000 characters of the output; the script prints no
          # secret value.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = Success ]
